# ABOUTME: Blue/Green bootstrap for the todolist app: two colored Deployments, one
# ABOUTME: ClusterIP Service each, a production Service (selector flipped by the switch
# ABOUTME: pipeline) and Ingresses routing production + per-color hosts via nginx.
---
apiVersion: v1
kind: Namespace
metadata:
  name: todolist-bg
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolist-blue
  namespace: todolist-bg
  labels:
    app: todolist
    color: blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todolist
      color: blue
  template:
    metadata:
      labels:
        app: todolist
        color: blue
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.37
          command:
            - sh
            - -c
            - until nc -z postgres.database.svc.cluster.local 5432; do echo "aguardando postgres"; sleep 2; done
      containers:
        - name: todolist
          image: ghcr.io/matheusbarros23/app-k8s-todolist:latest
          ports:
            - containerPort: 5000
          env:
            - name: APP_PORT
              value: "5000"
            - name: APP_COLOR
              value: blue
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: DATABASE_URI
              value: postgresql+psycopg2://todolist:$(POSTGRES_PASSWORD)@postgres.database.svc.cluster.local:5432/todolist
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolist-green
  namespace: todolist-bg
  labels:
    app: todolist
    color: green
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todolist
      color: green
  template:
    metadata:
      labels:
        app: todolist
        color: green
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.37
          command:
            - sh
            - -c
            - until nc -z postgres.database.svc.cluster.local 5432; do echo "aguardando postgres"; sleep 2; done
      containers:
        - name: todolist
          image: ghcr.io/matheusbarros23/app-k8s-todolist:latest
          ports:
            - containerPort: 5000
          env:
            - name: APP_PORT
              value: "5000"
            - name: APP_COLOR
              value: green
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: DATABASE_URI
              value: postgresql+psycopg2://todolist:$(POSTGRES_PASSWORD)@postgres.database.svc.cluster.local:5432/todolist
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
# Fixed per-color Service (direct access for testing the blue slot).
apiVersion: v1
kind: Service
metadata:
  name: todolist-blue
  namespace: todolist-bg
  labels:
    app: todolist
    color: blue
spec:
  type: ClusterIP
  selector:
    app: todolist
    color: blue
  ports:
    - port: 80
      targetPort: 5000
---
# Fixed per-color Service (direct access for testing the green slot).
apiVersion: v1
kind: Service
metadata:
  name: todolist-green
  namespace: todolist-bg
  labels:
    app: todolist
    color: green
spec:
  type: ClusterIP
  selector:
    app: todolist
    color: green
  ports:
    - port: 80
      targetPort: 5000
---
# Production Service: the switch pipeline flips its selector color.
apiVersion: v1
kind: Service
metadata:
  name: todolist
  namespace: todolist-bg
  labels:
    app: todolist
spec:
  type: ClusterIP
  selector:
    app: todolist
    color: blue
  ports:
    - port: 80
      targetPort: 5000
---
# One Ingress, three hosts: production (switched via the Service selector) and one
# stable host per color for direct testing before the switch.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todolist-bg
  namespace: todolist-bg
spec:
  ingressClassName: nginx
  rules:
    - host: todolist-bg.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todolist
                port:
                  number: 80
    - host: blue.todolist-bg.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todolist-blue
                port:
                  number: 80
    - host: green.todolist-bg.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todolist-green
                port:
                  number: 80
