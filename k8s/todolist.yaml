# ABOUTME: Minimal Kubernetes manifest to deploy the todolist app on kind.
# ABOUTME: Namespace + Deployment + ClusterIP Service + Ingress (host todolist.local).
---
apiVersion: v1
kind: Namespace
metadata:
  name: todolist
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolist
  namespace: todolist
  labels:
    app: todolist
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todolist
  template:
    metadata:
      labels:
        app: todolist
    spec:
      # O create_all() da app roda no import: sem o banco de pe, o pod entra em
      # CrashLoopBackOff ate o Postgres subir. Esperar aqui deixa o primeiro
      # deploy deterministico.
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.37
          command:
            - sh
            - -c
            - until nc -z postgres.database.svc.cluster.local 5432; do echo "aguardando postgres"; sleep 2; done
      containers:
        - name: todolist
          image: ghcr.io/matheusbarros23/app-k8s-todolist:latest
          ports:
            - containerPort: 5000
          env:
            - name: APP_PORT
              value: "5000"
            - name: APP_COLOR
              value: purple
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            # O $(VAR) e interpolado pelo Kubernetes a partir das env anteriores,
            # entao a senha nunca aparece literal no manifest.
            - name: DATABASE_URI
              value: postgresql+psycopg2://todolist:$(POSTGRES_PASSWORD)@postgres.database.svc.cluster.local:5432/todolist
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: todolist
  namespace: todolist
  labels:
    app: todolist
spec:
  type: ClusterIP
  selector:
    app: todolist
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todolist
  namespace: todolist
spec:
  ingressClassName: nginx
  rules:
    - host: todolist.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todolist
                port:
                  number: 80
