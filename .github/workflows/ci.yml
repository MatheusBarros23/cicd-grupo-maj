name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ci-cd-activity
  PYTHON_DEFAULT: '3.12'

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run flake8
        run: flake8 src tests

  test:
    name: Test
    uses: ./.github/workflows/_reusable-test.yml
    with:
      python-versions: '["3.11", "3.12", "3.13"]'

  security:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pip-audit
        run: pip-audit

  publish:
    name: Publish image to GHCR
    needs: [lint, test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve image reference
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          repo="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/$IMAGE_NAME"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.repo }}:${{ github.sha }}
            ${{ steps.image.outputs.repo }}:latest

  notify:
    name: Notify pipeline result
    needs: [lint, test, security, publish]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK_URL }}

    steps:
      - name: Compose message
        id: msg
        run: |
          if [ "${{ needs.lint.result }}" = "success" ] \
            && [ "${{ needs.test.result }}" = "success" ] \
            && [ "${{ needs.security.result }}" = "success" ]; then
            echo "status=✅ SUCESSO" >> "$GITHUB_OUTPUT"
            echo "color=3066993"    >> "$GITHUB_OUTPUT"
          else
            echo "status=❌ FALHA"  >> "$GITHUB_OUTPUT"
            echo "color=15158332"   >> "$GITHUB_OUTPUT"
          fi

      - name: Send webhook
        if: env.WEBHOOK != ''
        run: |
          cat > payload.json <<EOF
          {
            "embeds": [{
              "title": "${{ steps.msg.outputs.status }} — ${{ github.repository }}",
              "color": ${{ steps.msg.outputs.color }},
              "fields": [
                {"name": "Branch", "value": "${{ github.ref_name }}", "inline": true},
                {"name": "Autor", "value": "${{ github.actor }}", "inline": true}
              ],
              "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }]
          }
          EOF
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d @payload.json "$WEBHOOK"
